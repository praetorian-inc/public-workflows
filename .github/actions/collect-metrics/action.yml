name: Collect Leaderboard Metrics
description: >-
  Collect PR metrics for leaderboard scoring and write payload to
  $RUNNER_TEMP/payload.json. Precondition: the job must have checked out the
  base repo with full history (fetch-depth: 0) AND fetched the PR head SHA, so
  `git log base...head` can resolve the commit range. If the range cannot be
  resolved, the action does not fail — it warns and falls back to attributing
  the whole PR to the opener (co-author and capability attribution are lost).

inputs:
  github-token:
    description: GitHub token for API calls
    required: true
  repo:
    description: "owner/repo"
    required: true
  pr-number:
    description: Pull request number
    required: true
  pr-author:
    description: PR author GitHub login
    required: true
  pr-additions:
    description: Total lines added
    required: true
  pr-deletions:
    description: Total lines deleted
    required: true
  pr-files:
    description: Number of changed files
    required: true
  pr-merged-at:
    description: ISO timestamp of merge
    required: true
  pr-title:
    description: PR title
    required: true
  pr-body:
    description: PR body
    required: false
    default: ""
  base-sha:
    description: Base commit SHA
    required: true
  head-sha:
    description: Head commit SHA
    required: true
  email-map:
    description: "JSON object: GitHub login → email"
    required: true
  capability-map:
    description: "JSON array of capability path mappings"
    required: false
    default: "[]"

outputs:
  has-payload:
    description: Whether a payload was produced
    value: ${{ steps.collect.outputs.has_payload }}

runs:
  using: composite
  steps:
    - name: Collect PR metrics
      id: collect
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ inputs.repo }}
        PR_NUMBER: ${{ inputs.pr-number }}
        PR_AUTHOR: ${{ inputs.pr-author }}
        PR_ADDITIONS: ${{ inputs.pr-additions }}
        PR_DELETIONS: ${{ inputs.pr-deletions }}
        PR_FILES: ${{ inputs.pr-files }}
        PR_MERGED_AT: ${{ inputs.pr-merged-at }}
        PR_TITLE: ${{ inputs.pr-title }}
        PR_BODY: ${{ inputs.pr-body }}
        BASE_SHA: ${{ inputs.base-sha }}
        HEAD_SHA: ${{ inputs.head-sha }}
        EMAIL_MAP: ${{ inputs.email-map }}
        CAPABILITY_MAP: ${{ inputs.capability-map }}
      run: |
        if ! python3 "${{ github.action_path }}/collect_leaderboard_metrics.py"; then
          echo "::error::Metrics collection script failed"
          echo "has_payload=false" >> "$GITHUB_OUTPUT"
          exit 1
        fi
        if [ -f "${RUNNER_TEMP:-/tmp}/payload.json" ]; then
          echo "has_payload=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::No payload produced (author email not mapped). Skipping SQS send."
          echo "has_payload=false" >> "$GITHUB_OUTPUT"
        fi
