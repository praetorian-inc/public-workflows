name: Overlay PR files onto the review graph
description: >-
  Fail-open merge of a code-only extract of this PR's changed files into the
  fetched default-branch graph.json. Always succeeds. Missing graph, missing
  graphify, or a too-large diff leaves the base graph and records why in
  the provenance sidecar.

inputs:
  destination:
    description: Directory containing graph.json.
    required: false
    default: graphify-out
  max-files:
    description: Cap on changed source files extracted. Above this, skip the overlay.
    required: false
    default: "40"

runs:
  using: composite
  steps:
    - name: Overlay changed files
      shell: bash
      env:
        DEST: ${{ inputs.destination }}
        MAX_FILES: ${{ inputs.max-files }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/overlay-pr-graph.sh"
