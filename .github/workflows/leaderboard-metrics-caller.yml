# Self-caller: opts THIS repo's merged PRs into the org leaderboard by
# calling the reusable workflow that lives alongside it. Named
# leaderboard-metrics-caller.yml because leaderboard-metrics.yml here IS the
# reusable — same path can't host both.
name: Leaderboard Metrics Caller

on:
  # zizmor: ignore[dangerous-triggers]  # merge-event metadata only: no PR code checkout, read-only perms; reusable gates on merged == true internally
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  metrics:
    # The pinned SHA must be listed in the AWS IAM trust condition
    # (job_workflow_ref sub) — bump ONLY via the runbook in
    # leaderboard-metrics.yml's header (add new sub → deploy → roll pins →
    # remove old sub), or metrics stop at AssumeRole.
    uses: praetorian-inc/public-workflows/.github/workflows/leaderboard-metrics.yml@c351826e6de27cadeb5b32ce81157355b283518b # v2.16.3
