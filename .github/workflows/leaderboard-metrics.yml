# Reusable workflow for leaderboard metrics collection.
#
# Hosted in public-workflows (a PUBLIC repo) so that public, internal, and
# private praetorian-inc repos can all call it — GitHub forbids public repos
# from calling reusable workflows hosted in internal/private repos, which is
# why this moved here from praetorian-inc/.github (internal).
#
# ⚠ Callers pin this workflow to a FULL 40-char commit SHA (the exact form
# the OIDC `job_workflow_ref` claim carries), per this repo's SHA-pinning
# policy. The AWS IAM trust for the metrics role (guard backend/template.yml,
# LeaderboardMetricsRole) lists the accepted `job_workflow_ref` sub for each
# trusted SHA; a caller on any UNLISTED ref fails the trust match and its
# metrics stop at AssumeRole. Bumping the pinned SHA therefore requires the
# coordinated runbook (ENG-4164):
#   1. guard PR ADDS the new SHA's sub to the trust list
#   2. prod deploy — verify both subs live via `aws iam get-role`
#   3. roll every caller's `uses:` pin to the new SHA
#   4. follow-up guard PR REMOVES the old SHA's sub
# Defense in depth: this file is CODEOWNERS-gated to Security Engineering and
# main requires code-owner review (repo ruleset "protect-reusable-workflows").
#
# ⚠⚠ CALLER-ORG BOUNDARY — currently the job-level `github.repository_owner`
# guard below, NOT the IAM trust. `job_workflow_ref` names the CALLED (this)
# workflow and is IDENTICAL no matter who calls it, and with the callers' OIDC
# sub customization (include_claim_keys: [job_workflow_ref, environment]) the
# emitted `sub` carries NO caller identity at all — verified 2026-07-07 by
# decoding a live token (an earlier revision of this header claimed a
# `repo:praetorian-inc/*`-prefixed sub; that never matches under this
# customization). An IAM-level anchor on other claims does NOT work either:
# AWS maps only `sub`/`aud` into the condition context for this provider — a
# trust condition on `token.actions.githubusercontent.com:repository_owner`
# DENIES a token that provably carries that claim (A/B-tested 2026-07-07 with
# IAM propagation control). So the prod trust pins the exact customized sub
#   job_workflow_ref:<this path>@<trusted sha>:environment:leaderboard
# and the `if:` guard below is the PRIMARY caller-org boundary: an external
# org calling this PUBLIC reusable is skipped before the id-token step and
# never mints a token bearing this job_workflow_ref. Do NOT weaken or remove
# that guard — regressing it would let any org (with their own matching sub
# customization + a `leaderboard` environment) assume the metrics role.
# Compensating controls: this file is CODEOWNERS-gated to Security
# Engineering and main enforces code-owner review (ruleset
# "protect-reusable-workflows"). Blast radius if all layers fail:
# sqs:SendMessage to the metrics queue (forged leaderboard data) — the role
# has no other permissions.
#
# Future hardening (ENG-4219): add `repo` (or `repository_owner`)
# to every caller's include_claim_keys so the sub itself carries caller
# identity, then pin the trust to the new byte-exact layout (claim order in
# the sub follows include_claim_keys order). Requires a coordinated ~31-repo
# customization change + trust update, plus an inventory of other IAM trusts
# keyed on those repos' current customized subs (they break until updated).
#
# Caller template (drop in .github/workflows/leaderboard-metrics.yml):
#
#   name: Leaderboard Metrics
#   on:
#     pull_request_target:
#       types: [closed]
#   permissions:
#     contents: read
#     pull-requests: read
#     id-token: write
#   jobs:
#     metrics:
#       uses: praetorian-inc/public-workflows/.github/workflows/leaderboard-metrics.yml@c351826e6de27cadeb5b32ce81157355b283518b # v2.16.3
#       with:
#         capability_map: '[]'
#
# Caller repo one-time setup:
#   - A "leaderboard" GitHub environment (no protection rules needed).
#   - REQUIRED: the Actions OIDC sub-claim customization — without it the
#     token presents the default `repo:...` sub and AssumeRole is denied
#     (proven 2026-07-08: three repos onboarded without it all failed):
#       PUT /repos/{owner}/{repo}/actions/oidc/customization/sub
#       {"use_default": false,
#        "include_claim_keys": ["job_workflow_ref", "environment"]}
#     ⚠ Check FIRST for other workflows requesting `id-token: write`: the
#     customization changes the sub for EVERY OIDC job in the repo — each
#     must ALSO run in an environment (or it fails at job preparation with
#     "the claim 'environment' cannot be null or empty") and any IAM/cloud
#     trust keyed on its old sub must be updated. See go-release.yml's
#     `environment` input for the release-job fix.
#
# Org-level variables (visibility: all repositories):
#   ENGINEER_EMAIL_MAP               — JSON: GitHub login → @praetorian.com email
#   LEADERBOARD_METRICS_ROLE_ARN     — IAM role ARN for OIDC federation
#   LEADERBOARD_METRICS_QUEUE_URL    — SQS queue URL for metrics ingestion
#
# capability_map format (JSON array):
#   [{"path": "dir/", "name": "fixed-name"}]      — all changes under dir/ → one capability
#   [{"path": "dir/", "depth": 5}]                — derive name from path component at depth N (extension stripped)
#   [{"path": "dir/", "filename": true}]           — derive name from filename stem (no extension), any nesting depth
#   [{"path": ".", "name": "repo-name"}]           — whole-repo = single capability
#   []  or omitted                                 — no capability tracking

name: Leaderboard Metrics

on:
  workflow_call:
    inputs:
      capability_map:
        description: >
          JSON array of capability path mappings.
          Each entry: {"path": "dir/", "name": "cap"}, {"path": "dir/", "depth": N}, or {"path": "dir/", "filename": true}.
          "name" rolls all changes under that path into one capability.
          "depth" derives the name from the path component at that depth (extension stripped).
          "filename" uses each file's stem (name without extension) as the capability name.
        required: false
        type: string
        default: '[]'

env:
  AWS_REGION: us-east-2

jobs:
  submit-metrics:
    # repository_owner names the CALLER (see header): a non-praetorian org that
    # calls this PUBLIC reusable is skipped before any id-token / AWS step runs.
    # This is the PRIMARY caller-org boundary — the IAM trust sub carries no
    # caller identity (see header). Do not weaken or remove.
    if: >-
      github.event.pull_request.merged == true &&
      github.repository_owner == 'praetorian-inc'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: leaderboard
    # Request id-token only in the job that federates to AWS (min-scope).
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      # Block egress to everything except the hosts this job legitimately
      # needs. Allowlist derived from harden-runner AUDIT telemetry across six
      # runs (guard + augustus callers, 2026-07-07), grouped by purpose:
      #   github.com                        (git fetch of PR head)
      #   api.github.com                    (gh api calls in collect-metrics)
      #   *.actions.githubusercontent.com   (OIDC id-token fetch — the host is
      #                                      region-varying, e.g.
      #                                      run-actions-3-azure-eastus.…)
      #   sts.us-east-2.amazonaws.com       (AssumeRoleWithWebIdentity)
      #   sqs.us-east-2.amazonaws.com       (metrics send)
      # codeload/objects/release-assets.githubusercontent.com never appeared
      # in audit (action tarballs download during job set-up, before step
      # monitoring starts) but are GitHub-owned read-only CDNs — kept for
      # robustness; api.github.com is the only real bidirectional channel and
      # is required regardless. Runner-infra endpoints
      # (results-receiver, log-upload blob storage) need no entry — proven by
      # changelog-scan.yml, which runs in block mode without them. If a future
      # run fails on a blocked endpoint, the harden-runner step summary names
      # the host — add it here rather than reverting to audit. A blocked run
      # fails LOUDLY and that PR's metrics are lost (no retry): accepted
      # trade-off, exfil resistance over delivery guarantee.
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            sts.us-east-2.amazonaws.com:443
            sqs.us-east-2.amazonaws.com:443
          # No step here needs sudo or containers, and a spawned container
          # would re-enter an unrestricted network namespace — close that
          # egress-bypass path too (same posture as changelog-scan.yml).
          disable-sudo-and-containers: true

      # Check out the CALLER repo's BASE ref (pull_request_target semantics) —
      # PR head code is never executed; the head SHA is fetched below as diff
      # DATA only. Credentials persist because the fetch step below needs them
      # on internal/private caller repos.
      - name: Checkout caller repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Fetch PR head ref
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch origin "$HEAD_SHA"

      # The collect-metrics composite lives in THIS repo but must be referenced
      # by immutable SHA (a floating @main composite would drift at runtime even
      # though this reusable is itself reviewed — the exact failure class the
      # SHA-pin policy exists for). Any change to the action therefore requires
      # a follow-up PR here bumping this pin — reviewed drift only.
      - name: Collect PR metrics
        id: collect
        uses: praetorian-inc/public-workflows/.github/actions/collect-metrics@5d40d2300abf493740f98b0a1f53620eb6921310 # v2.15.0
        with:
          github-token: ${{ github.token }}
          repo: ${{ github.repository }}
          pr-number: ${{ github.event.pull_request.number }}
          pr-author: ${{ github.event.pull_request.user.login }}
          pr-additions: ${{ github.event.pull_request.additions }}
          pr-deletions: ${{ github.event.pull_request.deletions }}
          pr-files: ${{ github.event.pull_request.changed_files }}
          pr-merged-at: ${{ github.event.pull_request.merged_at }}
          pr-title: ${{ github.event.pull_request.title }}
          pr-body: ${{ github.event.pull_request.body }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          email-map: ${{ vars.ENGINEER_EMAIL_MAP }}
          capability-map: ${{ inputs.capability_map }}

      - name: Configure AWS credentials
        if: steps.collect.outputs.has-payload == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.LEADERBOARD_METRICS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Send metrics to SQS
        if: steps.collect.outputs.has-payload == 'true'
        env:
          QUEUE_URL: ${{ vars.LEADERBOARD_METRICS_QUEUE_URL }}
        # Runs under bash -e: an aws CLI failure aborts the step with its
        # stderr in the job log. The jq guard below covers only the exit-0
        # no-MessageId edge; file:// sidesteps ARG_MAX on huge payloads.
        run: |
          aws sqs send-message \
            --queue-url "$QUEUE_URL" \
            --message-body "file://$RUNNER_TEMP/payload.json" \
            --output json > "$RUNNER_TEMP/sqs-response.json"

          if ! message_id=$(jq -re '.MessageId' "$RUNNER_TEMP/sqs-response.json"); then
            echo "::error::SQS response missing MessageId: $(cat "$RUNNER_TEMP/sqs-response.json")"
            exit 1
          fi
          echo "Metrics queued: $message_id"
