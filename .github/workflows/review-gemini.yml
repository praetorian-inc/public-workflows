name: Gemini PR Assistant

on:
  pull_request:
    types: [opened, ready_for_review]
  pull_request_review_comment:
    types: [created]

# Least-privilege default; the job below scopes exactly what the reviewer needs.
permissions:
  contents: read

jobs:
  gemini-review:
    uses: ./.github/workflows/gemini-code.yml
    permissions:
      contents: read
      pull-requests: write
      actions: read  # ENG-7654: fetch-graph downloads this repo's graphify artifact
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}