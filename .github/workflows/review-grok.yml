name: Grok PR Assistant

on:
  pull_request:
    types: [opened, ready_for_review]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

jobs:
  grok-review:
    uses: ./.github/workflows/grok-code.yml
    permissions:
      contents: read
      pull-requests: write
      actions: read
    secrets:
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
