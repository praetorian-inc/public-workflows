name: Test audit-delivery
# Unit tests for the audit-delivery composite action's detector script.
# Node built-in test runner only — no npm install, no network beyond the
# checkout. Guards the pure logic (flag parsing, the five-way delivery
# classification, head_sha dedupe, replay ordering, report rendering) against
# regression. The networking layer is not covered here: it was validated
# against the live API, and mocking fetch would only test the mock.

on:
  pull_request:
    paths:
      - ".github/actions/audit-delivery/**"
      - ".github/workflows/test-audit-delivery.yml"
  push:
    branches: [main]
    paths:
      - ".github/actions/audit-delivery/**"
      - ".github/workflows/test-audit-delivery.yml"

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40  # v2.19.0
        with:
          egress-policy: audit
          disable-sudo-and-containers: true

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      # Pinned rather than relying on whatever node the runner image ships:
      # the detector needs global fetch (18+) and the test file uses the
      # node:test runner, so the version is part of what this job asserts.
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          # The test files are enumerated by the shell and passed explicitly,
          # NOT as `node --test <dir>`: on node 22 a bare directory argument is
          # resolved as a module rather than searched (MODULE_NOT_FOUND), and a
          # node-side glob that matches nothing exits 0 — which would let this
          # job pass green having run zero tests. Both failure modes are
          # foreclosed by expanding here and counting the result.
          tests=(.github/actions/audit-delivery/*.test.mjs)
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "::error::No *.test.mjs files found under .github/actions/audit-delivery/ — this job would have reported success without running a single test."
            exit 1
          fi

          printf 'node %s — running %d test file(s):\n' "$(node --version)" "${#tests[@]}"
          printf '  %s\n' "${tests[@]}"
          node --test "${tests[@]}"
