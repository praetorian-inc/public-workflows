name: Test go-sec.yml (self-test)
# Self-test harness for the go-sec.yml reusable workflow.
# Pull requests run the focused toolchain contract; the three live reusable
# calls are skipped because a workflow-only PR has no Go changes. Non-main
# branch pushes on the same relevant paths and manual dispatches invoke
# go-sec.yml locally against _test-fixtures/go-minimal.
#
# SARIF upload is disabled in self-test to keep the harness stateless — we
# don't want self-test findings polluting public-workflows's own Security tab.
# The SARIF upload path is still covered indirectly by consumer repos that
# adopt the workflow with upload-sarif: true.

on:
  pull_request:
    paths:
      - '.github/workflows/go-sec.yml'
      - '.github/workflows/test-go-sec.yml'
      - 'test/go-sec-toolchain-contract.test.sh'
      - '_test-fixtures/go-minimal/**'
  push:
    branches-ignore:
      - main
    paths:
      - '.github/workflows/go-sec.yml'
      - '.github/workflows/test-go-sec.yml'
      - 'test/go-sec-toolchain-contract.test.sh'
      - '_test-fixtures/go-minimal/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  toolchain-contract:
    name: Caller Go toolchain contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40  # v2.19.0
        with:
          egress-policy: audit
          disable-sudo-and-containers: true

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python3 -m pip install --disable-pip-version-check --no-input "PyYAML==6.0.2"

      - name: Test caller Go toolchain contract
        run: bash test/go-sec-toolchain-contract.test.sh

  call-go-sec-defaults:
    if: ${{ github.event_name != 'pull_request' }}
    name: Call go-sec (defaults, SARIF off)
    uses: ./.github/workflows/go-sec.yml
    permissions:
      contents: read          # go-sec.yml preflight now uses the compare API + repo tree — contents:read only (no pull-requests:read). This job pins contents:read deliberately so the self-test proves go-sec is invocable by a narrow caller.
      security-events: write  # gosec/govulncheck jobs statically declare it — grant even with upload-sarif:false, else startup_failure
      actions: read           # required by codeql-action/upload-sarif metadata fetch
    with:
      working-directory: _test-fixtures/go-minimal
      upload-sarif: false

  call-go-sec-gosec-only:
    if: ${{ github.event_name != 'pull_request' }}
    name: Call go-sec (gosec only)
    uses: ./.github/workflows/go-sec.yml
    permissions:
      contents: read          # go-sec.yml preflight now uses the compare API + repo tree — contents:read only (no pull-requests:read). This job pins contents:read deliberately so the self-test proves go-sec is invocable by a narrow caller.
      security-events: write  # gosec/govulncheck jobs statically declare it — grant even with upload-sarif:false, else startup_failure
      actions: read           # required by codeql-action/upload-sarif metadata fetch
    with:
      working-directory: _test-fixtures/go-minimal
      enable-govulncheck: false
      upload-sarif: false

  call-go-sec-govulncheck-only:
    if: ${{ github.event_name != 'pull_request' }}
    name: Call go-sec (govulncheck only)
    uses: ./.github/workflows/go-sec.yml
    permissions:
      contents: read          # go-sec.yml preflight now uses the compare API + repo tree — contents:read only (no pull-requests:read). This job pins contents:read deliberately so the self-test proves go-sec is invocable by a narrow caller.
      security-events: write  # gosec/govulncheck jobs statically declare it — grant even with upload-sarif:false, else startup_failure
      actions: read           # required by codeql-action/upload-sarif metadata fetch
    with:
      working-directory: _test-fixtures/go-minimal
      enable-gosec: false
      upload-sarif: false
