---
name: "TEMP: empty-environment semantics probe"

# THROWAWAY — DELETE BEFORE MERGE. Verifies the one empirical assumption behind
# the ts-release.yml `environment` input: that `environment: ${{ inputs.X }}`
# with an empty-string value means "no environment" and does NOT break job
# scheduling. If empty-string were rejected, adding the input would break every
# existing ts-release caller (they all leave it ""). Neither job requests
# id-token: write — public-workflows itself has an OIDC sub-claim customization
# that includes "environment", so an id-token job with no environment would fail
# for that unrelated reason; this probe isolates empty-string semantics only.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment string (leave empty to test empty-string semantics)."
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  empty-env:
    # Empty string by default — this is the case existing callers hit.
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report
        shell: bash
        run: echo "empty-env job scheduled and ran; inputs.environment='${{ inputs.environment }}'"

  named-env:
    # Control: a concrete environment that GitHub auto-creates (unprotected).
    environment: tmp-test-env
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report
        shell: bash
        run: echo "named-env job scheduled and ran in environment 'tmp-test-env'"
