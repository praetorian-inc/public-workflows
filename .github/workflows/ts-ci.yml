name: TypeScript CI (Callable)
# Reusable workflow for TypeScript/Node.js repositories in the praetorian-inc org.
# Provides consistent install + typecheck + lint + test + Harden-Runner across
# all Claude plugin repos and other TypeScript projects.
#
# Caller example (drop this in .github/workflows/ci.yml of a consumer repo):
#
#   name: CI
#   on:
#     push: { branches: [main] }
#     pull_request: { branches: [main] }
#   permissions:
#     contents: read
#   jobs:
#     ci:
#       uses: praetorian-inc/public-workflows/.github/workflows/ts-ci.yml@<SHA>  # vX.Y.Z
#       permissions:
#         contents: read
#
# For repos with private dependencies (e.g. @praetorian/claude-tool-sdk):
#
#   jobs:
#     ci:
#       uses: praetorian-inc/public-workflows/.github/workflows/ts-ci.yml@<SHA>  # vX.Y.Z
#       permissions:
#         contents: read
#       with:
#         enable-private-deps: true
#         private-deps-repos: claude-tool-sdk
#       secrets:
#         PLUGIN_CI_APP_ID: ${{ secrets.PLUGIN_CI_APP_ID }}
#         PLUGIN_CI_PRIVATE_KEY: ${{ secrets.PLUGIN_CI_PRIVATE_KEY }}

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Working directory for the Node.js project."
        required: false
        type: string
        default: "."

      node-version:
        description: "Node.js version to use."
        required: false
        type: string
        default: "22"

      enable-typecheck:
        description: "Run tsc --noEmit if tsconfig.json exists."
        required: false
        type: boolean
        default: true

      enable-lint:
        description: "Run npm run lint (skipped if the script is not defined in package.json)."
        required: false
        type: boolean
        default: true

      enable-test:
        description: "Run npm test."
        required: false
        type: boolean
        default: true

      test-script:
        description: >
          npm script to run for tests. Left empty, it defaults to the "test"
          script and is skipped (with a notice) if that script doesn't exist —
          so repos with no tests aren't forced to fail. Set explicitly and the
          named script must exist, or the Test job fails.
        required: false
        type: string
        default: ""

      enable-private-deps:
        description: "Generate a GitHub App token for private dependency access before npm ci."
        required: false
        type: boolean
        default: false

      private-deps-owner:
        description: "GitHub org for private dependency access."
        required: false
        type: string
        default: "praetorian-inc"

      private-deps-repos:
        description: >
          Comma-separated repo names the App token is scoped to. No default:
          required when enable-private-deps is true. A blank value is rejected
          rather than passed through, because create-github-app-token treats an
          empty repositories list (with owner set) as "all repositories in the
          owner's installation" — far broader than intended.
        required: false
        type: string
        default: ""

      enable-harden-runner:
        description: "Enable StepSecurity Harden-Runner as the first step of every job."
        required: false
        type: boolean
        default: true

      harden-runner-policy:
        description: "Harden-Runner egress policy: 'audit' or 'block'."
        required: false
        type: string
        default: "audit"

      harden-runner-allowed-endpoints:
        description: "Newline-separated allowed endpoints for block mode."
        required: false
        type: string
        default: ""

    secrets:
      PLUGIN_CI_APP_ID:
        description: "GitHub App ID for private dependency access. Required when enable-private-deps is true."
        required: false
      PLUGIN_CI_PRIVATE_KEY:
        description: "GitHub App private key. Required when enable-private-deps is true."
        required: false

permissions:
  contents: read

jobs:
  # Preflight: skip CI entirely if the PR has no TypeScript/JS-relevant changes.
  # Always runs on push-to-main, schedule, and workflow_dispatch.
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      has_ts: ${{ steps.check.outputs.has_ts }}
    steps:
      - name: Harden Runner
        if: ${{ inputs.enable-harden-runner }}
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40  # v2.19.0
        with:
          egress-policy: ${{ inputs.harden-runner-policy }}
          allowed-endpoints: ${{ inputs.harden-runner-allowed-endpoints }}
          disable-sudo-and-containers: true

      - name: Check for TypeScript/JS changes
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu

          # Non-PR events always run.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "has_ts=true" >> "$GITHUB_OUTPUT"
            echo "✓ Non-PR event ($EVENT_NAME) — TS CI will run."
            exit 0
          fi

          # Detect changed files via the commits compare API, which needs only
          # `contents: read`. The pulls/{n}/files API would need `pull-requests:
          # read` — and because a reusable workflow's job can never hold more
          # permission than its caller grants, requiring it broke narrow callers
          # (and this preflight already pinned contents:read, so pulls/files
          # returned 403 at runtime). Three-dot base...head matches pulls/files
          # semantics. Fail open (run CI) if the call fails for any reason.
          if ! FILES=$(gh api "repos/$REPO/compare/$BASE_SHA...$HEAD_SHA" --jq '.files[]?.filename' 2>/dev/null); then
            echo "has_ts=true" >> "$GITHUB_OUTPUT"
            echo "✓ Could not list changed files (compare API error) — running TS CI to be safe."
            exit 0
          fi
          COUNT=$(printf '%s\n' "$FILES" | grep -c . || true)

          # The compare endpoint caps `.files` at 300. On a larger diff we cannot
          # be sure no TS/JS files changed, so fail open and run CI.
          if [ "$COUNT" -ge 300 ]; then
            echo "has_ts=true" >> "$GITHUB_OUTPUT"
            echo "✓ Large diff (>=300 changed files) — running TS CI to be safe."
            exit 0
          fi

          echo "Changed files in PR ($COUNT total):"
          printf '%s\n' "$FILES" | sed 's/^/  /'
          echo

          TS_RE='\.(tsx|ts|jsx|js|mjs|cjs)$|^package\.json$|^package-lock\.json$|^tsconfig|^vitest\.config|^\.eslintrc|^eslint\.config'
          if printf '%s\n' "$FILES" | grep -E "$TS_RE" | grep -q .; then
            echo "has_ts=true" >> "$GITHUB_OUTPUT"
            echo "✓ TypeScript/JS changes detected — CI will run."
          else
            echo "has_ts=false" >> "$GITHUB_OUTPUT"
            echo "⊘ No TypeScript/JS changes — CI will be skipped."
          fi

  install:
    name: Install & cache
    needs: preflight
    if: needs.preflight.outputs.has_ts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        if: ${{ inputs.enable-harden-runner }}
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40  # v2.19.0
        with:
          egress-policy: ${{ inputs.harden-runner-policy }}
          allowed-endpoints: ${{ inputs.harden-runner-allowed-endpoints }}
          disable-sudo-and-containers: true

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Validate private-dependency scope
        # enable-private-deps mints a GitHub App token scoped to
        # private-deps-repos. create-github-app-token treats an empty
        # `repositories` (with `owner` set) as "all repositories in the owner's
        # installation", so a blank private-deps-repos would silently mint a far
        # broader token than intended. Fail closed instead of minting it.
        if: ${{ inputs.enable-private-deps }}
        env:
          PRIVATE_DEPS_REPOS: ${{ inputs.private-deps-repos }}
          PRIVATE_DEPS_OWNER: ${{ inputs.private-deps-owner }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PRIVATE_DEPS_REPOS//[[:space:]]/}" ]; then
            echo "::error::enable-private-deps is true but private-deps-repos is empty. Set private-deps-repos to the comma-separated repo names the App token should be scoped to; leaving it empty would scope the token to every repository the App can access in the '${PRIVATE_DEPS_OWNER}' installation."
            exit 1
          fi

      - name: Generate token for private dependencies
        if: ${{ inputs.enable-private-deps }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0 # zizmor: ignore[github-app] token scope bounded by plugin-ci App install
        with:
          app-id: ${{ secrets.PLUGIN_CI_APP_ID }}
          private-key: ${{ secrets.PLUGIN_CI_PRIVATE_KEY }}
          owner: ${{ inputs.private-deps-owner }}
          repositories: ${{ inputs.private-deps-repos }}

      - name: Configure git for private dependencies
        if: ${{ inputs.enable-private-deps }}
        env:
          GIT_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://x-access-token:${GIT_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://x-access-token:${GIT_TOKEN}@github.com/".insteadOf "git@github.com:"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          # Cross-run npm cache; node_modules is handed off via artifact, not this.
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      # Hand node_modules to downstream jobs via a run-scoped artifact (no cross-PR
      # cache-key collisions). tar first: artifacts drop the exec bit and symlinks,
      # which would leave node_modules/.bin/* non-executable.
      - name: Archive node_modules
        env:
          # Via env, not inline ${{ }}, to avoid shell injection (zizmor).
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          NODE_MODULES_TAR: ${{ runner.temp }}/node-modules.tar
        run: tar -cf "$NODE_MODULES_TAR" -C "$WORKING_DIRECTORY" node_modules

      - name: Upload node_modules for downstream jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: node-modules-${{ inputs.node-version }}-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}
          path: ${{ runner.temp }}/node-modules.tar
          if-no-files-found: error
          retention-days: 1
          overwrite: true
          compression-level: 1

  typecheck:
    name: Type check
    needs: [preflight, install]
    if: needs.preflight.outputs.has_ts == 'true' && inputs.enable-typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        if: ${{ inputs.enable-harden-runner }}
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40  # v2.19.0
        with:
          egress-policy: ${{ inputs.harden-runner-policy }}
          allowed-endpoints: ${{ inputs.harden-runner-allowed-endpoints }}
          disable-sudo-and-containers: true

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Download node_modules
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: node-modules-${{ inputs.node-version }}-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}
          path: ${{ runner.temp }}

      - name: Extract node_modules
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          NODE_MODULES_TAR: ${{ runner.temp }}/node-modules.tar
        run: tar -xf "$NODE_MODULES_TAR" -C "$WORKING_DIRECTORY"

      - name: Type check
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ -f tsconfig.json ]; then
            npx tsc --noEmit
          else
            echo "No tsconfig.json found — skipping type check"
          fi

  lint:
    name: Lint
    needs: [preflight, install]
    if: needs.preflight.outputs.has_ts == 'true' && inputs.enable-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        if: ${{ inputs.enable-harden-runner }}
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40  # v2.19.0
        with:
          egress-policy: ${{ inputs.harden-runner-policy }}
          allowed-endpoints: ${{ inputs.harden-runner-allowed-endpoints }}
          disable-sudo-and-containers: true

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Download node_modules
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: node-modules-${{ inputs.node-version }}-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}
          path: ${{ runner.temp }}

      - name: Extract node_modules
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          NODE_MODULES_TAR: ${{ runner.temp }}/node-modules.tar
        run: tar -xf "$NODE_MODULES_TAR" -C "$WORKING_DIRECTORY"

      - name: Lint
        working-directory: ${{ inputs.working-directory }}
        run: |
          if jq -e '.scripts.lint' package.json > /dev/null 2>&1; then
            npm run lint
          else
            echo "No lint script in package.json — skipping"
          fi

  test:
    name: Test
    needs: [preflight, install]
    if: needs.preflight.outputs.has_ts == 'true' && inputs.enable-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        if: ${{ inputs.enable-harden-runner }}
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40  # v2.19.0
        with:
          egress-policy: ${{ inputs.harden-runner-policy }}
          allowed-endpoints: ${{ inputs.harden-runner-allowed-endpoints }}
          disable-sudo-and-containers: true

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Validate private-dependency scope
        # enable-private-deps mints a GitHub App token scoped to
        # private-deps-repos. create-github-app-token treats an empty
        # `repositories` (with `owner` set) as "all repositories in the owner's
        # installation", so a blank private-deps-repos would silently mint a far
        # broader token than intended. Fail closed instead of minting it.
        if: ${{ inputs.enable-private-deps }}
        env:
          PRIVATE_DEPS_REPOS: ${{ inputs.private-deps-repos }}
          PRIVATE_DEPS_OWNER: ${{ inputs.private-deps-owner }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PRIVATE_DEPS_REPOS//[[:space:]]/}" ]; then
            echo "::error::enable-private-deps is true but private-deps-repos is empty. Set private-deps-repos to the comma-separated repo names the App token should be scoped to; leaving it empty would scope the token to every repository the App can access in the '${PRIVATE_DEPS_OWNER}' installation."
            exit 1
          fi

      - name: Generate token for private dependencies
        if: ${{ inputs.enable-private-deps }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0 # zizmor: ignore[github-app] token scope bounded by plugin-ci App install
        with:
          app-id: ${{ secrets.PLUGIN_CI_APP_ID }}
          private-key: ${{ secrets.PLUGIN_CI_PRIVATE_KEY }}
          owner: ${{ inputs.private-deps-owner }}
          repositories: ${{ inputs.private-deps-repos }}

      - name: Configure git for private dependencies
        if: ${{ inputs.enable-private-deps }}
        env:
          GIT_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://x-access-token:${GIT_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://x-access-token:${GIT_TOKEN}@github.com/".insteadOf "git@github.com:"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Download node_modules
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: node-modules-${{ inputs.node-version }}-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}
          path: ${{ runner.temp }}

      - name: Extract node_modules
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          NODE_MODULES_TAR: ${{ runner.temp }}/node-modules.tar
        run: tar -xf "$NODE_MODULES_TAR" -C "$WORKING_DIRECTORY"

      - name: Run tests
        working-directory: ${{ inputs.working-directory }}
        env:
          TEST_SCRIPT: ${{ inputs.test-script }}
        # Run the script if it exists; fail if an explicit test-script is missing
        # (misconfig); skip if only the default "test" is absent (repo has none).
        run: |
          set -euo pipefail
          script="${TEST_SCRIPT:-test}"
          if [ "$(npm pkg get "scripts.$script")" != "{}" ]; then
            npm run "$script"
          elif [ -n "${TEST_SCRIPT:-}" ]; then
            echo "::error::test-script '$TEST_SCRIPT' is not defined in package.json scripts."
            exit 1
          else
            echo "::notice::No 'test' script in package.json — no tests to run. Set enable-test: false to be explicit."
          fi
